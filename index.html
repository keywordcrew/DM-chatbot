<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #08338F, #0D47C9);
        min-height: 100vh;
        color: white;
    }

    .hero {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
    }

    .logo {
        width: 250px;
        max-width: 80%;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .tagline {
        font-size: 1.3rem;
        color: #d6d6d8;
        margin-bottom: 25px;
    }

    .services {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 900px;
        margin-bottom: 30px;
    }

    .service {
        background: rgba(255,255,255,0.15);
        padding: 10px 20px;
        border-radius: 30px;
        backdrop-filter: blur(10px);
    }

    .cta {
        font-size: 1.1rem;
        margin-top: 20px;
        color: #ffffff;
    }

    footer {
        position: fixed;
        bottom: 15px;
        width: 100%;
        text-align: center;
        color: rgba(255,255,255,0.8);
        font-size: 14px;
    }
</style>
<section class="hero">

    <!-- Replace with your logo URL -->
    <img src="logo.png" alt="Keyword Crew Logo" class="logo">

    <h1>Keyword Crew</h1>

    <p class="tagline">
        The Crew Behind Your Digital Growth
    </p>

    <div class="services">
        <div class="service">SEO</div>
        <div class="service">Google Ads</div>
        <div class="service">Meta Ads</div>
        <div class="service">Social Media Marketing</div>
        <div class="service">Website Development</div>
        <div class="service">Lead Generation</div>
    </div>

    <p class="cta">
        💬 Click the chat button and speak with our AI Marketing Consultant
    </p>

</section>

<footer>
    © 2026 Keyword Crew | Digital Marketing Agency
</footer>

<flowise-fullchatbot></flowise-fullchatbot>

<script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

    Chatbot.initFull({
        chatflowid: "2215194d-36c4-427d-a41d-b83ccb18053c",
        apiHost: "https://cloud.flowiseai.com",

        theme: {
            button: {
                backgroundColor: "#0D47C9",
                right: 20,
                bottom: 20,
                size: 60,
                dragAndDrop: true,
                iconColor: "#FFFFFF"
            },

            chatWindow: {
                showTitle: true,
                title: "Keyword Crew - The Crew Behind Your Digital Growth",
         

                welcomeMessage:
                    "👋 Welcome to Keyword Crew! How can we help grow your business today?",

                backgroundColor: "#FFFFFF",

                botMessage: {
                    backgroundColor: "#0D47C9",
                    textColor: "#FFFFFF"
                },

                userMessage: {
                    backgroundColor: "#D6D6D8",
                    textColor: "#111111"
                },

                textInput: {
                    placeholder: "Type your message..."
                }
            }
        }
    })
</script>
